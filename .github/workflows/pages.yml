# GitHub Pages：把 site/ 渲染后发到 Pages（官方 artifact 流程，不用 gh-pages 分支）。
#
# 前置（仓库 Settings → Pages 做一次）：Build and deployment → Source 选 **GitHub Actions**。
# 之后每次推 main 或打 v* tag 就自动发布；也能在 Actions 页手动 Run workflow。
#
# 为什么不用 paths 过滤：站点里的版本号取自 mygo.json（跟着发版走），只改代码不发版时也该重渲染；
# 每次全量重建成本约 30s，Pages 免费额度完全够。
#
# 为什么不按 tag 触发：`github-pages` environment 有 branch_policy（只允许 main 部署），
# 打 tag 推上来那次会在 deploy 步骤失败；而且 cancel-in-progress 会把同一次发版的 main 那次取消掉。
# 发版流程本来就先推 main 再打 tag，main 那次足够了。
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 渲染站点（注入 mygo.json 的版本号）
        run: sh tools/build-site.sh
      - uses: actions/configure-pages@v5
        with:
          enablement: true # 仓库还没开 Pages 时顺手开（需要 pages: write）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
