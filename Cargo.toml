[package]
name = "nsh-app-clipnest"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.5.1"
nsh-base = "0.5.1"
env_logger = "0.11"
log = "0.4"
clipboard-rs = "0.3"
rusqlite = { version = "0.42.0", features = ["bundled"] }
blake3 = "1.8.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.2", features = ["v4"] }
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
getrandom = "0.4.3"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.1", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPasteboard", "NSApplication", "NSWindow", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false }
core-graphics = "0.25"

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.1", default-features = false }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Threading"] }
